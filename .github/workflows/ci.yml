name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Lint, build & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Check OpenAPI spec is up to date
        run: |
          npm run docs:generate
          if ! git diff --quiet -- docs/openapi.json; then
            echo "::error::docs/openapi.json is out of date with the current routes."
            echo "Run 'npm run docs:generate' locally and commit the result."
            git diff -- docs/openapi.json
            exit 1
          fi

  integration:
    name: Integration tests (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: swipely
          POSTGRES_PASSWORD: swipely
          POSTGRES_DB: swipely_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swipely -d swipely_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://swipely:swipely@localhost:5432/swipely_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run migrations
        run: npm run migrate

      - name: Seed database
        run: npm run seed

      - name: Integration tests
        run: npm run test:integration
